<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Skullnaut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1b0f0b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #touch{position:fixed;inset:0;pointer-events:none;display:none}
  #touch .pad{position:absolute;bottom:14px;display:flex;gap:10px;pointer-events:none}
  #touch .left{left:14px}
  #touch .right{right:14px;flex-wrap:wrap;width:250px;justify-content:flex-end}
  #touch button{pointer-events:auto;width:74px;height:74px;border-radius:50%;border:3px solid #2b1a12;
    background:rgba(236,214,166,.55);color:#2b1a12;font:700 14px 'Bungee',Impact,sans-serif;touch-action:none}
  #touch button.ult{background:rgba(255,122,26,.75)}
  #touch button:active,#touch button.on{background:rgba(255,210,63,.85)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch">
  <div class="pad left"><button data-k="left">&#9664;</button><button data-k="right">&#9654;</button><button data-k="down">&#9660;</button></div>
  <div class="pad right"><button data-k="ult" class="ult">FIRE</button><button data-k="punch">PUNCH</button><button data-k="shoot">SHOOT</button><button data-k="jump">JUMP</button></div>
</div>
<script>
(() => {
'use strict';
const W = 960, H = 540, GROUND = 460, ARENA_W = 960, BREATH_T = 4.2;
const FONT = "'Bungee', Impact, 'Arial Black', sans-serif";
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * scale) + 'px'; cv.style.height = (H * scale) + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

// ---------- helpers ----------
const PI2 = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const COL = { ol: '#2b1a12', suit: '#ecd6a6', suitSh: '#cdb07c', brown: '#8a5634', brownL: '#a0703f', olive: '#6e7a3a', oliveD: '#4f5928',
  skull: '#f3e0b2', skullSh: '#d6bb84', eye: '#1d1310', metal: '#5b5f55' };

function rrPath(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function rr(x, y, w, h, r, fill, noStroke) { ctx.beginPath(); rrPath(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); if (!noStroke) ctx.stroke(); }
function circ(x, y, r, fill, noStroke) { ctx.beginPath(); ctx.arc(x, y, r, 0, PI2); ctx.fillStyle = fill; ctx.fill(); if (!noStroke) ctx.stroke(); }
function ell(x, y, rx, ry, fill, noStroke) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, PI2); ctx.fillStyle = fill; ctx.fill(); if (!noStroke) ctx.stroke(); }
function text(str, x, y, size, fill, align = 'center', stroke = COL.ol, lw) {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = lw || Math.max(3, size / 6); ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); ctx.fillStyle = fill; ctx.fillText(str, x, y);
}

// ---------- input ----------
const keys = {}, pressed = {};
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
  ArrowDown: 'down', KeyS: 'down', KeyJ: 'shoot', KeyX: 'shoot', KeyK: 'punch', KeyZ: 'punch', KeyL: 'ult', KeyC: 'ult',
  Enter: 'start', KeyP: 'pause', Escape: 'pause', KeyM: 'mute' };
function press(a) { if (!keys[a]) pressed[a] = true; keys[a] = true; audio.unlock(); }
function release(a) { keys[a] = false; }
addEventListener('keydown', e => { const a = KEYMAP[e.code]; if (!a) return; e.preventDefault(); press(a); });
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (!a) return; e.preventDefault(); release(a); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) {
  document.getElementById('touch').style.display = 'block';
  document.querySelectorAll('#touch button').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); b.classList.add('on'); press(k); };
    const off = e => { e.preventDefault(); b.classList.remove('on'); release(k); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });
}
cv.addEventListener('pointerdown', () => { audio.unlock(); if (state === 'title' || state === 'over' || state === 'win') pressed.start = true; });

// ---------- audio ----------
const audio = {
  ctx: null, master: null, noiseBuf: null, muted: false, breath: null,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.35; this.master.connect(this.ctx.destination);
    const len = this.ctx.sampleRate; const b = this.ctx.createBuffer(1, len, this.ctx.sampleRate); const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; this.noiseBuf = b;
  },
  tone(freq, dur, type = 'square', vol = 0.2, slide = 0, delay = 0) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol = 0.2, freq = 1000, type = 'lowpass') {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime, s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  startBreath() {
    if (!this.ctx || this.muted || this.breath) return;
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noiseBuf; s.loop = true; f.type = 'lowpass'; f.frequency.value = 700; g.gain.value = 0.5;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(); this.breath = { s, f, g };
  },
  stopBreath() {
    if (!this.breath) return; const b = this.breath; this.breath = null;
    const t = this.ctx.currentTime; b.g.gain.setTargetAtTime(0, t, 0.08); b.s.stop(t + 0.4);
  }
};
const sfx = {
  shoot() { audio.tone(900, 0.07, 'square', 0.08, -550); },
  jump() { audio.tone(280, 0.12, 'square', 0.08, 320); },
  punch() { audio.noise(0.09, 0.3, 600); audio.tone(160, 0.08, 'triangle', 0.2, -60); },
  hit() { audio.noise(0.05, 0.18, 2400, 'bandpass'); },
  boom() { audio.noise(0.5, 0.45, 380); audio.tone(110, 0.45, 'sine', 0.35, -70); },
  hurt() { audio.tone(240, 0.25, 'sawtooth', 0.2, -160); },
  pick() { audio.tone(660, 0.07, 'square', 0.1); audio.tone(990, 0.1, 'square', 0.1, 0, 0.06); },
  ready() { [523, 659, 784, 1046].forEach((f, i) => audio.tone(f, 0.16, 'triangle', 0.22, 0, i * 0.08)); },
  roar() { audio.tone(95, 0.9, 'sawtooth', 0.3, -45); audio.noise(0.9, 0.35, 450); },
  enemyShot() { audio.tone(420, 0.1, 'sawtooth', 0.06, -200); },
  check() { [392, 523, 659].forEach((f, i) => audio.tone(f, 0.14, 'triangle', 0.2, 0, i * 0.09)); },
  crate() { audio.noise(0.18, 0.3, 900); }
};

// ---------- level ----------
function buildLevel(seed) {
  const R = mulberry32(seed), rr_ = (a, b) => a + R() * (b - a), ri = (a, b) => Math.round(rr_(a, b));
  const L = { solids: [], plats: [], crates: [], enemies: [], pickups: [], checkpoints: [], decor: [], arenaX: 0, length: 0 };
  L.solids.push({ x: -400, y: -1000, w: 400, h: 3000, wall: true });
  L.solids.push({ x: 0, y: GROUND, w: 900, h: H - GROUND + 300 });
  L.checkpoints.push({ x: 80, y: GROUND, active: true, hidden: true });
  L.crates.push({ x: 520, y: GROUND - 36, w: 36, h: 36, hp: 3 });
  for (let i = 0; i < 4; i++) L.pickups.push(mkPickup('gear', 640 + i * 40, GROUND - 120, true));
  L.plats.push({ x: 600, y: GROUND - 100, w: 180, h: 14, plat: true });
  let x = 900, y = GROUND, nextCP = 3000;
  const END = 11500;
  while (x < END) {
    const d = x / END;
    if (R() < 0.42) {
      const gw = ri(90, 150 + d * 30);
      if (gw > 135 || R() < 0.3) L.plats.push({ x: Math.round(x + gw / 2 - 60), y: y - ri(70, 100), w: 120, h: 14, plat: true });
      x += gw;
    }
    const ny = [GROUND, GROUND - 40, GROUND - 80][Math.floor(R() * 3)];
    y = ny;
    const w = ri(560, 1000);
    L.solids.push({ x, y, w, h: H - y + 300 });
    if (x >= nextCP) { L.checkpoints.push({ x: x + 60, y, active: false }); nextCP += 2900; }
    // platforms
    let px = x + ri(80, 200);
    while (px < x + w - 220) {
      if (R() < 0.6) {
        const pw = ri(110, 200), py = y - ri(110, 145);
        L.plats.push({ x: px, y: py, w: pw, h: 14, plat: true });
        if (R() < 0.6) for (let i = 0; i < 3; i++) L.pickups.push(mkPickup('gear', px + pw / 2 - 40 + i * 40, py - 40, true));
        if (R() < 0.3 && py - 125 > 120) {
          const p2 = { x: px + ri(30, 100), y: py - ri(110, 125), w: ri(100, 150), h: 14, plat: true };
          L.plats.push(p2);
          L.pickups.push(mkPickup(R() < 0.5 ? 'heart' : 'battery', p2.x + p2.w / 2 - 12, p2.y - 40, true));
        }
      }
      px += ri(260, 420);
    }
    // enemies
    const n = Math.floor(rr_(1, 2.3 + d * 2.6));
    for (let i = 0; i < n; i++) {
      const ex = x + ri(160, w - 90), r = R();
      let t;
      if (d < 0.15) t = r < 0.7 ? 'crawler' : 'drone';
      else if (d < 0.4) t = r < 0.45 ? 'crawler' : r < 0.75 ? 'drone' : 'gunner';
      else t = r < 0.28 ? 'crawler' : r < 0.52 ? 'drone' : r < 0.8 ? 'gunner' : 'brute';
      L.enemies.push(makeEnemy(t, ex, t === 'drone' ? y - ri(150, 220) : y, d));
    }
    if (R() < 0.6) L.crates.push({ x: x + ri(100, w - 140), y: y - 36, w: 36, h: 36, hp: 3 });
    for (let i = 0; i < 4; i++) L.decor.push({ x: x + ri(20, w - 20), y, type: Math.floor(R() * 4), s: rr_(0.7, 1.3) });
    x += w;
  }
  L.arenaX = x + 260;
  L.solids.push({ x, y: GROUND, w: 260 + ARENA_W, h: H - GROUND + 300 });
  L.checkpoints.push({ x: x + 80, y: GROUND, active: false });
  L.length = L.arenaX + ARENA_W;
  L.solids.push({ x: L.length, y: -1000, w: 400, h: 3000, wall: true });
  return L;
}

function mkPickup(type, x, y, float = false) { return { type, x, y, w: 24, h: 24, vx: 0, vy: float ? 0 : -320, float, t: Math.random() * 6, life: float ? Infinity : 14 }; }

function makeEnemy(type, x, groundY, d = 0) {
  const e = { type, x, y: 0, vx: 0, vy: 0, face: -1, flash: 0, stun: 0, burn: 0, t: Math.random() * 10, cd: rand(0.5, 2), state: 'walk', st: 0, dead: false, d };
  if (type === 'crawler') Object.assign(e, { w: 40, h: 30, hp: 3, speed: 70 + d * 40, score: 100, ult: 9 });
  if (type === 'drone') Object.assign(e, { w: 40, h: 28, hp: 2, score: 150, ult: 9, state: 'hover', baseY: groundY });
  if (type === 'gunner') Object.assign(e, { w: 36, h: 58, hp: 5, score: 250, ult: 12, aimA: 0, muzzle: 0 });
  if (type === 'brute') Object.assign(e, { w: 62, h: 76, hp: 14, score: 500, ult: 22 });
  e.maxHp = e.hp;
  e.y = type === 'drone' ? groundY : groundY - e.h;
  return e;
}

// ---------- game state ----------
let state = 'title', level, P, cam = { x: 0, shake: 0 }, bullets = [], ebullets = [], parts = [], texts = [], waves = [];
let enemies = [], crates = [], pickups = [], solidList = [], boss = null, arena = false, lockWall = null;
let score = 0, best = 0, lives = 3, hitStop = 0, flashT = 0, flashCol = '#fff', deadT = 0, winT = 0, bannerT = 0, paused = false, gtime = 0, titleBreath = 0;
try { best = +localStorage.getItem('skullnaut_best') || 0; } catch (e) {}
const LEVEL_SEED = 7;

function makePlayer(x, y) {
  return { x, y, w: 36, h: 80, vx: 0, vy: 0, face: 1, hp: 6, maxHp: 6, inv: 2, hurtLock: 0, onGround: false, ground: null, coyote: 0, jumpBuf: 0, jumps: 0,
    shootCd: 0, aim: 0, recoil: 0, punch: 0, punchCd: 0, punchHit: null, breath: 0, ult: 0, walk: 0, t: 0, drop: 0, safe: { x, y } };
}
function newGame() {
  level = buildLevel(LEVEL_SEED);
  enemies = level.enemies; crates = level.crates; pickups = level.pickups;
  bullets = []; ebullets = []; parts = []; texts = []; waves = [];
  boss = null; arena = false; lockWall = null; score = 0; lives = 3; gtime = 0; winT = 0;
  P = makePlayer(80, GROUND - 80); P.ult = 40;
  cam.x = 0; state = 'play'; paused = false;
}
function respawn() {
  const cp = [...level.checkpoints].reverse().find(c => c.active);
  const ult = P.ult;
  P = makePlayer(cp.x, cp.y - 80); P.ult = Math.max(ult, 30);
  if (arena) { arena = false; boss = null; level.solids = level.solids.filter(s => s !== lockWall); lockWall = null; enemies = enemies.filter(e => !e.fromBoss); }
  ebullets = []; waves = [];
  state = 'play';
}

// ---------- physics ----------
function moveBody(b, dt, oneWay = true) {
  b.onGround = false; b.hitWall = 0;
  b.x += b.vx * dt;
  for (const s of solidList) if (overlap(b, s)) {
    if (b.vx > 0) { b.x = s.x - b.w; b.hitWall = 1; } else if (b.vx < 0) { b.x = s.x + s.w; b.hitWall = -1; }
    b.vx = 0;
  }
  const prevBottom = b.y + b.h;
  b.y += b.vy * dt;
  for (const s of solidList) if (overlap(b, s)) {
    if (b.vy > 0) { b.y = s.y - b.h; b.onGround = true; b.ground = s; } else if (b.vy < 0) b.y = s.y + s.h;
    b.vy = 0;
  }
  if (oneWay && b.vy >= 0) for (const p of level.plats)
    if (prevBottom <= p.y + 0.5 && b.y + b.h >= p.y && b.x + b.w > p.x && b.x < p.x + p.w) { b.y = p.y - b.h; b.vy = 0; b.onGround = true; b.ground = p; }
}
function groundAt(x, y) {
  for (const s of solidList) if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) return true;
  for (const p of level.plats) if (x >= p.x && x <= p.x + p.w && y >= p.y && y <= p.y + 12) return true;
  return false;
}
function solidAtPoint(x, y) { for (const s of solidList) if (x > s.x && x < s.x + s.w && y > s.y && y < s.y + s.h) return s; return null; }

// ---------- effects ----------
function addP(o) {
  if (parts.length > 1400) return;
  const p = Object.assign({ vx: 0, vy: 0, life: 0.5, size: 3, color: '#fff', grav: 0, drag: 0, type: 'c', add: false, grow: 0 }, o);
  p.max = p.life; parts.push(p);
}
function burst(x, y, n, colors, spd = 300, size = 4, grav = 900) {
  for (let i = 0; i < n; i++) { const a = rand(0, PI2), s = rand(spd * 0.3, spd); addP({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, life: rand(0.3, 0.8), size: rand(size * 0.5, size * 1.3), color: colors[i % colors.length], grav, drag: 1 }); }
}
function explode(x, y, big = 1) {
  burst(x, y, 18 * big, ['#ffd23f', '#ff7a1a', '#fff6c8'], 380 * big, 5, 400);
  for (let i = 0; i < 8 * big; i++) addP({ x: x + rand(-10, 10) * big, y: y + rand(-10, 10) * big, vx: rand(-80, 80), vy: rand(-120, -20), life: rand(0.5, 1), size: rand(8, 14) * big, grow: 30, color: '#5a3a2a', type: 'smoke', drag: 1.5 });
  addP({ x, y, life: 0.3, size: 10 * big, grow: 300 * big, type: 'ring', color: '#fff6c8' });
  shake(6 * big); sfx.boom();
}
function floatText(x, y, str, color = '#fff6c8', size = 18) { texts.push({ x, y, str, color, size, life: 0.9 }); }
function shake(a) { cam.shake = Math.max(cam.shake, a); }
function flash(c, t = 0.15) { flashCol = c; flashT = t; }
function addScore(n) { score += n; }
function gainUlt(n) {
  if (P.breath > 0) return;
  const before = P.ult; P.ult = Math.min(100, P.ult + n);
  if (before < 100 && P.ult >= 100) { sfx.ready(); floatText(P.x + P.w / 2, P.y - 30, 'FIRE BREATH READY!', '#ffd23f', 20); }
}

// ---------- damage ----------
function hurtPlayer(dmg, fromX) {
  if (state !== 'play' || P.inv > 0 || P.breath > 0) return;
  P.hp -= dmg; P.inv = 1.3; P.hurtLock = 0.25;
  P.vx = (P.x + P.w / 2 < fromX ? -1 : 1) * 380; P.vy = -380;
  shake(10); flash('#ff3b2f', 0.18); sfx.hurt(); hitStop = 0.06;
  burst(P.x + P.w / 2, P.y + 30, 10, ['#f3e0b2', '#ecd6a6'], 250, 4);
  if (P.hp <= 0) killPlayer();
}
function killPlayer() {
  P.hp = 0; lives--; state = 'dead'; deadT = 1.8; audio.stopBreath(); P.breath = 0;
  explode(P.x + P.w / 2, P.y + 30, 1.3);
  burst(P.x + P.w / 2, P.y + 20, 24, ['#f3e0b2', '#ecd6a6', '#6e7a3a'], 450, 6);
}
function damageEnemy(e, dmg, kind, dir = 0) {
  if (e.dead) return;
  e.hp -= dmg;
  if (kind === 'fire') { e.burn = 0.6; e.flash = 0.04; }
  else {
    e.flash = 0.1; sfx.hit(); gainUlt(kind === 'punch' ? 3 : 1.5);
    floatText(e.x + e.w / 2 + rand(-8, 8), e.y - 6, String(dmg), kind === 'punch' ? '#ffd23f' : '#fff6c8', kind === 'punch' ? 22 : 16);
    const kb = (e.type === 'brute' ? 0.3 : 1) * (kind === 'punch' ? 420 : 90);
    if (dir) { e.vx = dir * kb; if (e.type !== 'drone') e.vy = kind === 'punch' ? -220 * (e.type === 'brute' ? 0.4 : 1) : e.vy; else e.vy = -60; e.stun = kind === 'punch' ? 0.35 : 0.08; }
  }
  if (e.hp <= 0) killEnemy(e, kind);
}
function killEnemy(e, kind) {
  e.dead = true;
  const cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  explode(cx, cy, e.type === 'brute' ? 1.6 : 1);
  const cols = { crawler: ['#8cc63f', '#4e7d23'], drone: ['#9aa6ab', '#5e6a70'], gunner: ['#3f7f86', '#56a0a6'], brute: ['#7b4fa0', '#55337a'] }[e.type];
  burst(cx, cy, 12, cols, 350, 5);
  addScore(e.score); floatText(cx, e.y - 20, '+' + e.score, '#ffd23f', 18);
  gainUlt(e.ult);
  hitStop = Math.max(hitStop, 0.04);
  const r = Math.random();
  if (r < 0.13) pickups.push(mkPickup('heart', cx - 12, cy - 12));
  else if (r < 0.25) pickups.push(mkPickup('battery', cx - 12, cy - 12));
  else if (r < 0.6) pickups.push(mkPickup('gear', cx - 12, cy - 12));
}
function breakCrate(c) {
  c.hp = 0; crates.splice(crates.indexOf(c), 1);
  const cx = c.x + c.w / 2, cy = c.y + c.h / 2;
  burst(cx, cy, 16, ['#a0703f', '#8a5634', '#c79a5e'], 320, 5);
  sfx.crate(); addScore(50); shake(3);
  const r = Math.random();
  pickups.push(mkPickup(r < 0.25 ? 'heart' : r < 0.5 ? 'battery' : 'gear', cx - 12, cy - 12));
}
function damageBoss(dmg, kind) {
  if (!boss || boss.dead || boss.state === 'drop') return;
  boss.hp -= dmg; boss.flash = kind === 'fire' ? 0.04 : 0.08;
  if (kind !== 'fire') { sfx.hit(); gainUlt(kind === 'punch' ? 2.5 : 0.8); floatText(boss.x + boss.w / 2 + rand(-40, 40), boss.y + rand(10, 60), String(dmg), '#fff6c8', 18); }
  if (boss.hp <= 0) { boss.hp = 0; boss.dead = true; boss.state = 'die'; boss.t = 2.4; audio.stopBreath(); ebullets = []; waves = []; for (const e of enemies) if (e.fromBoss) killEnemy(e, 'x'); }
}

// ---------- player ----------
function updatePlayer(dt) {
  const p = P;
  p.t += dt; p.inv = Math.max(0, p.inv - dt); p.hurtLock = Math.max(0, p.hurtLock - dt);
  p.shootCd -= dt; p.punchCd -= dt; p.aim = Math.max(0, p.aim - dt); p.recoil = Math.max(0, p.recoil - dt * 8); p.drop = Math.max(0, p.drop - dt);
  const breathing = p.breath > 0;
  const dir = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  if (p.hurtLock <= 0) {
    p.vx = approach(p.vx, dir * (breathing ? 120 : 290), (p.onGround ? 2600 : 1700) * dt);
    if (dir) p.face = dir;
  }
  if (pressed.jump) p.jumpBuf = 0.13; else p.jumpBuf -= dt;
  if (p.onGround) { p.coyote = 0.1; p.jumps = 0; } else p.coyote -= dt;
  if (p.jumpBuf > 0) {
    if (keys.down && p.onGround && p.ground && p.ground.plat) { p.drop = 0.25; p.jumpBuf = 0; p.y += 2; }
    else if (p.coyote > 0) { p.vy = -700; p.coyote = 0; p.jumpBuf = 0; p.jumps = 1; sfx.jump(); dust(p.x + p.w / 2, p.y + p.h, 6); }
    else if (p.jumps < 2) {
      p.vy = -620; p.jumps = 2; p.jumpBuf = 0; sfx.jump();
      for (let i = 0; i < 10; i++) { const a = i / 10 * PI2; addP({ x: p.x + p.w / 2, y: p.y + p.h, vx: Math.cos(a) * 160, vy: Math.sin(a) * 50 + 40, life: 0.35, size: 4, color: '#ffd23f', drag: 3 }); }
    }
  }
  if (!keys.jump && p.vy < -260) p.vy = -260;
  p.vy = Math.min(p.vy + 1900 * dt, 1050);
  const wasGround = p.onGround;
  moveBody(p, dt, p.drop <= 0);
  if (!wasGround && p.onGround) dust(p.x + p.w / 2, p.y + p.h, 5);
  if (p.onGround && p.ground && !p.ground.plat && !crates.includes(p.ground) && p.x > p.ground.x + 10 && p.x + p.w < p.ground.x + p.ground.w - 10) p.safe = { x: p.x, y: p.y };
  if (p.onGround) p.walk += Math.abs(p.vx) * dt * 0.045;

  // shoot
  if (keys.shoot && p.shootCd <= 0 && !breathing) {
    p.shootCd = 0.14; p.aim = 0.28; p.recoil = 1;
    const mx = p.x + p.w / 2 + p.face * 44, my = p.y + p.h - 34;
    bullets.push({ x: mx, y: my, vx: p.face * 980, vy: rand(-20, 20), life: 0.75, r: 5 });
    for (let i = 0; i < 4; i++) addP({ x: mx, y: my, vx: p.face * rand(80, 220), vy: rand(-80, 80), life: 0.12, size: 4, color: '#fff6c8', add: true });
    sfx.shoot();
  }
  // punch
  if (pressed.punch && p.punchCd <= 0 && !breathing) { p.punch = 0.24; p.punchCd = 0.36; p.punchHit = new Set(); sfx.punch(); }
  if (p.punch > 0) {
    p.punch -= dt;
    if (p.punch < 0.19 && p.punch > 0.05) {
      const hb = { x: p.face > 0 ? p.x + p.w - 6 : p.x - 46, y: p.y + 10, w: 52, h: 40 };
      for (const e of enemies) if (!e.dead && !p.punchHit.has(e) && overlap(hb, e)) { p.punchHit.add(e); damageEnemy(e, 3, 'punch', p.face); hitStop = 0.07; shake(5); burst(hb.x + hb.w / 2, hb.y + 20, 8, ['#fff6c8', '#ffd23f'], 300, 4, 0); }
      for (const c of [...crates]) if (overlap(hb, c)) breakCrate(c);
      for (const b of ebullets) if (!b.dead && overlap(hb, { x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 })) { b.dead = true; addScore(25); floatText(b.x, b.y, 'PARRY!', '#9fe3ff', 16); burst(b.x, b.y, 6, ['#9fe3ff', '#fff'], 200, 3, 0); }
      if (boss && !p.punchHit.has(boss) && overlap(hb, boss)) { p.punchHit.add(boss); damageBoss(3, 'punch'); hitStop = 0.07; shake(5); }
    }
  }
  // ultimate
  if (pressed.ult && p.ult >= 100 && !breathing) {
    p.breath = BREATH_T; sfx.roar(); audio.startBreath(); shake(14); flash('#ff7a1a', 0.25); hitStop = 0.12;
    floatText(p.x + p.w / 2, p.y - 40, 'FIRE BREATH!!', '#ff7a1a', 26);
  } else if (pressed.ult && !breathing && p.ult < 100) floatText(p.x + p.w / 2, p.y - 20, 'Not charged', '#d6bb84', 14);
  if (p.breath > 0) {
    p.breath -= dt; p.ult = Math.max(0, 100 * p.breath / BREATH_T);
    breathFire(p.x + p.w / 2 + p.face * 8, p.y + p.h - 72, p.face, dt, p.vx, 1);
    cam.shake = Math.max(cam.shake, 3);
    if (p.breath <= 0) { p.breath = 0; p.ult = 0; audio.stopBreath(); }
  }
  if (p.y > H + 80) {
    p.hp -= 1; sfx.hurt(); flash('#ff3b2f', 0.2);
    if (p.hp <= 0) { killPlayer(); return; }
    p.x = p.safe.x; p.y = p.safe.y - 4; p.vx = 0; p.vy = 0; p.inv = 1.5;
  }
}
function dust(x, y, n) { for (let i = 0; i < n; i++) addP({ x: x + rand(-12, 12), y, vx: rand(-90, 90), vy: rand(-80, -10), life: rand(0.25, 0.45), size: rand(3, 6), grow: 12, color: '#d9a066', drag: 3, type: 'smoke' }); }

function breathFire(mx, my, face, dt, pvx, sc) {
  const n = Math.round(280 * dt) + 1;
  for (let i = 0; i < n; i++)
    addP({ type: 'f', x: mx + face * rand(0, 8) * sc, y: my + rand(-4, 4) * sc, vx: face * rand(600, 900) * sc + pvx * 0.6, vy: rand(-120, 120) * sc,
      life: rand(0.35, 0.62), size: rand(5, 9) * sc, grow: 55 * sc, drag: 1.2, add: true });
  if (Math.random() < dt * 25) addP({ x: mx + face * rand(100, 280) * sc, y: my + rand(-20, 20), vx: face * rand(60, 160), vy: rand(-140, -60), life: rand(0.6, 1.1), size: rand(10, 18) * sc, grow: 25, color: '#3a2620', type: 'smoke', drag: 1 });
  if (state !== 'play') return;
  const inCone = (o) => {
    const tx = (o.x + o.w / 2 - mx) * face; if (tx < -10 || tx > 340) return false;
    const half = 26 + Math.max(0, tx) * 0.32; return Math.abs(o.y + o.h / 2 - my) < half + o.h / 2;
  };
  for (const e of enemies) if (!e.dead && inCone(e)) damageEnemy(e, 24 * dt, 'fire');
  for (const c of [...crates]) if (inCone(c)) breakCrate(c);
  for (const b of ebullets) if (inCone({ x: b.x - 4, y: b.y - 4, w: 8, h: 8 })) { b.dead = true; burst(b.x, b.y, 3, ['#ffd23f'], 100, 3, 0); }
  if (boss && inCone(boss)) damageBoss(24 * dt, 'fire');
}

// ---------- enemies ----------
function updateEnemies(dt) {
  const pcx = P.x + P.w / 2, pcy = P.y + P.h / 2;
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.x < cam.x - 450 || e.x > cam.x + W + 350) continue;
    e.t += dt; e.flash -= dt; e.stun -= dt;
    if (e.burn > 0) { e.burn -= dt; if (Math.random() < dt * 25) addP({ type: 'f', x: e.x + rand(0, e.w), y: e.y + rand(0, e.h), vy: -rand(40, 120), life: 0.35, size: 5, grow: 20, add: true }); }
    const ecx = e.x + e.w / 2, dx = pcx - ecx, adx = Math.abs(dx);
    if (e.type === 'crawler') {
      if (e.stun <= 0) { if (adx < 260 && Math.abs(P.y + P.h - e.y - e.h) < 40) e.face = Math.sign(dx) || e.face; e.vx = e.face * e.speed * (adx < 260 ? 1.5 : 1); }
      else e.vx = approach(e.vx, 0, 900 * dt);
      if (e.stun <= 0 && e.onGround && !groundAt(e.face > 0 ? e.x + e.w + 3 : e.x - 3, e.y + e.h + 6)) { e.face *= -1; e.vx = e.face * e.speed; }
      e.vy += 1900 * dt; moveBody(e, dt);
      if (e.stun <= 0 && e.hitWall) e.face *= -1;
    } else if (e.type === 'drone') {
      e.cd -= dt; e.face = dx > 0 ? 1 : -1;
      if (e.stun > 0) { e.x += e.vx * dt; e.y += e.vy * dt; e.vx *= 0.9; }
      else if (e.state === 'dive') {
        e.st -= dt; const a = Math.atan2(pcy - e.y, dx); e.x += Math.cos(a) * 280 * dt; e.y += Math.sin(a) * 280 * dt;
        if (e.st <= 0) e.state = 'hover';
      } else {
        const ty = e.baseY + Math.sin(e.t * 2.5) * 18; e.y += (ty - e.y) * Math.min(1, dt * 2.5);
        if (adx < 560 && adx > 40) e.x += Math.sign(dx) * 110 * dt;
        if (adx < 200 && e.cd <= 0 && pcy > e.y) { e.state = 'dive'; e.st = 1; e.cd = 2.8; }
      }
    } else if (e.type === 'gunner') {
      e.vy += 1900 * dt; if (e.stun <= 0) e.vx = approach(e.vx, 0, 900 * dt); moveBody(e, dt);
      e.face = dx > 0 ? 1 : -1; e.cd -= dt; e.muzzle -= dt;
      const gx = ecx + e.face * 22, gy = e.y + 26;
      e.aimA = Math.atan2(pcy - gy, dx);
      if (adx < 620 && e.cd <= 0 && ecx > cam.x + 10 && ecx < cam.x + W - 10) {
        const s = 330 + e.d * 80;
        ebullets.push({ x: gx, y: gy, vx: Math.cos(e.aimA) * s, vy: Math.sin(e.aimA) * s, r: 6, life: 4 });
        e.cd = rand(1.5, 2.2) - e.d * 0.5; e.muzzle = 0.1; sfx.enemyShot();
      }
    } else if (e.type === 'brute') {
      e.vy += 1900 * dt;
      if (e.stun > 0) e.vx = approach(e.vx, 0, 900 * dt);
      else if (e.state === 'walk') {
        e.cd -= dt;
        if (adx < 650) { e.face = dx > 0 ? 1 : -1; e.vx = e.face * 60; } else e.vx = 0;
        if (adx < 340 && e.cd <= 0 && Math.abs(P.y + P.h - (e.y + e.h)) < 90) { e.state = 'wind'; e.st = 0.55; }
      } else if (e.state === 'wind') { e.vx = 0; e.st -= dt; if (e.st <= 0) { e.state = 'charge'; e.st = 1; audio.tone(130, 0.3, 'sawtooth', 0.2, -50); } }
      else if (e.state === 'charge') { e.vx = e.face * 400; e.st -= dt; if (Math.random() < dt * 30) dust(e.x + e.w / 2, e.y + e.h, 1); if (e.st <= 0) { e.state = 'walk'; e.cd = 2; } }
      if (e.onGround && e.vx && !groundAt(e.vx > 0 ? e.x + e.w + 4 : e.x - 4, e.y + e.h + 6)) { e.vx = 0; if (e.state === 'charge') { e.state = 'walk'; e.cd = 2; } }
      moveBody(e, dt);
      if (e.state === 'charge' && e.hitWall) { e.state = 'walk'; e.cd = 2; shake(6); }
    }
    if (overlap(e, P)) hurtPlayer(e.type === 'brute' && e.state === 'charge' ? 2 : 1, ecx);
    if (e.y > H + 100) e.dead = true;
  }
  enemies = enemies.filter(e => !e.dead);
}

// ---------- boss ----------
function spawnBoss() { boss = { x: level.arenaX + ARENA_W - 260, y: -320, w: 140, h: 170, vx: 0, vy: 0, hp: 260, max: 260, state: 'drop', t: 0, face: -1, flash: 0, anim: 0, volley: 0, dead: false, air: false }; }
function updateBoss(dt) {
  const b = boss; if (!b) return;
  b.anim += dt; b.flash -= dt;
  const enraged = b.hp < b.max * 0.5;
  const bcx = b.x + b.w / 2, pcx = P.x + P.w / 2;
  if (b.state === 'die') {
    b.t -= dt; b.vx = 0;
    if (Math.random() < dt * 14) explode(b.x + rand(0, b.w), b.y + rand(0, b.h), 0.8);
    if (b.t <= 0) { explode(bcx, b.y + b.h / 2, 3); flash('#fff6c8', 0.5); addScore(5000); floatText(bcx, b.y, '+5000', '#ffd23f', 30); boss = null; winT = 2.2; }
    return;
  }
  b.vy = Math.min(b.vy + 2000 * dt, 1400);
  moveBody(b, dt, false);
  if (enraged && Math.random() < dt * 10) addP({ x: b.x + rand(10, b.w - 10), y: b.y + 20, vx: rand(-30, 30), vy: rand(-120, -60), life: 0.8, size: 8, grow: 20, color: '#c2311a', type: 'smoke', drag: 1 });
  switch (b.state) {
    case 'drop':
      if (b.onGround) { shake(20); sfx.boom(); dust(bcx, b.y + b.h, 20); b.state = 'roar'; b.t = 1.3; sfx.roar(); flash('#ff3b2f', 0.15); }
      break;
    case 'roar': b.t -= dt; if (b.t <= 0) { b.state = 'idle'; b.t = 0.6; } break;
    case 'idle':
      b.vx = approach(b.vx, 0, 1500 * dt); b.face = pcx > bcx ? 1 : -1; b.t -= dt;
      if (b.t <= 0) {
        const r = Math.random(), drones = enemies.filter(e => e.fromBoss).length;
        if (drones < 2 && r < 0.22) b.state = 'summon';
        else if (r < 0.6) { b.state = 'spray'; b.volley = enraged ? 4 : 3; b.t = 0.3; }
        else b.state = 'stomp';
      }
      break;
    case 'spray':
      b.t -= dt;
      if (b.t <= 0) {
        const mx = bcx + b.face * 128, my = b.y + 70, n = enraged ? 7 : 5, base = Math.atan2(P.y + 35 - my, pcx - mx);
        for (let i = 0; i < n; i++) { const a = base + (i - (n - 1) / 2) * 0.17; ebullets.push({ x: mx, y: my, vx: Math.cos(a) * 360, vy: Math.sin(a) * 360, r: 7, life: 4, big: true }); }
        burst(mx, my, 6, ['#ff3b2f', '#ffd23f'], 200, 4, 0); sfx.enemyShot(); shake(3);
        b.volley--; b.t = enraged ? 0.28 : 0.4;
        if (b.volley <= 0) { b.state = 'idle'; b.t = enraged ? 0.7 : 1.1; }
      }
      break;
    case 'stomp':
      if (b.onGround) { b.vy = -950; b.vx = clamp((pcx - bcx) / 1.0, -560, 560); b.state = 'stompAir'; b.air = true; audio.tone(200, 0.3, 'square', 0.15, 300); }
      break;
    case 'stompAir':
      if (b.onGround && b.air && b.vy === 0) {
        b.air = false; b.vx = 0; shake(18); sfx.boom(); dust(bcx, b.y + b.h, 18);
        const sp = enraged ? 480 : 400;
        waves.push({ x: b.x - 30, y: b.y + b.h - 30, w: 30, h: 30, vx: -sp, life: 3 }, { x: b.x + b.w, y: b.y + b.h - 30, w: 30, h: 30, vx: sp, life: 3 });
        b.state = 'idle'; b.t = enraged ? 0.7 : 1.0;
      }
      break;
    case 'summon':
      for (const sx of [b.x - 40, b.x + b.w + 40]) { const d = makeEnemy('drone', clamp(sx, level.arenaX + 40, level.length - 80), rand(150, 210), 0.8); d.y = -40; d.fromBoss = true; enemies.push(d); }
      audio.tone(600, 0.3, 'triangle', 0.15, -300); b.state = 'idle'; b.t = 1.0;
      break;
  }
  if (overlap(b, P)) hurtPlayer(b.state === 'stompAir' ? 2 : 1, bcx);
}

// ---------- projectiles & pickups ----------
function updateProjectiles(dt) {
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0) { b.dead = true; continue; }
    const box = { x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 };
    const c = crates.find(c => overlap(box, c));
    if (c) { b.dead = true; c.hp--; burst(b.x, b.y, 4, ['#c79a5e'], 150, 3); sfx.hit(); if (c.hp <= 0) breakCrate(c); continue; }
    if (solidAtPoint(b.x, b.y)) { b.dead = true; burst(b.x, b.y, 4, ['#fff6c8', '#ffd23f'], 150, 3); continue; }
    const e = enemies.find(e => !e.dead && overlap(box, e));
    if (e) { b.dead = true; damageEnemy(e, 1, 'shot', Math.sign(b.vx)); burst(b.x, b.y, 5, ['#fff6c8', '#ffd23f'], 180, 3, 0); continue; }
    if (boss && overlap(box, boss)) { b.dead = true; damageBoss(1, 'shot'); burst(b.x, b.y, 5, ['#fff6c8', '#ffd23f'], 180, 3, 0); }
  }
  bullets = bullets.filter(b => !b.dead);
  for (const b of ebullets) {
    if (b.dead) continue;
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || solidAtPoint(b.x, b.y)) { b.dead = true; burst(b.x, b.y, 3, ['#ff3b2f'], 120, 3); continue; }
    if (state === 'play' && overlap({ x: b.x - b.r + 2, y: b.y - b.r + 2, w: b.r * 2 - 4, h: b.r * 2 - 4 }, P) && P.inv <= 0 && P.breath <= 0) { b.dead = true; hurtPlayer(1, b.x - b.vx); }
  }
  ebullets = ebullets.filter(b => !b.dead);
  for (const w of waves) {
    w.x += w.vx * dt; w.life -= dt;
    if (Math.random() < dt * 40) addP({ type: 'f', x: w.x + w.w / 2, y: w.y + w.h, vx: -w.vx * 0.1, vy: rand(-160, -60), life: 0.35, size: 6, grow: 20, add: true });
    if (overlap(w, P)) hurtPlayer(1, w.x + w.w / 2 - w.vx);
  }
  waves = waves.filter(w => w.life > 0 && w.x > level.arenaX - 60 && w.x < level.length + 20);
}
function updatePickups(dt) {
  for (const k of pickups) {
    k.t += dt;
    if (!k.float) { k.vy = Math.min(k.vy + 1500 * dt, 900); k.vx = 0; moveBody(k, dt); k.life -= dt; }
    if (overlap(k, P)) {
      k.dead = true; sfx.pick();
      const cx = k.x + 12, cy = k.y;
      if (k.type === 'gear') { addScore(100); floatText(cx, cy, '+100', '#ffd23f', 14); }
      if (k.type === 'heart') { if (P.hp < P.maxHp) { P.hp++; floatText(cx, cy, '+1 HP', '#ff6b5b', 18); } else { addScore(300); floatText(cx, cy, '+300', '#ffd23f', 16); } }
      if (k.type === 'battery') { gainUlt(35); floatText(cx, cy, '+FIRE', '#ff7a1a', 18); }
      burst(cx, cy + 12, 8, ['#ffd23f', '#fff6c8'], 180, 3, 0);
    }
    if (k.y > H + 50 || k.life <= 0) k.dead = true;
  }
  pickups = pickups.filter(k => !k.dead);
  for (const c of level.checkpoints) if (!c.active && P.x + P.w > c.x) {
    c.active = true; sfx.check(); floatText(c.x, c.y - 100, 'CHECKPOINT', '#c8e07a', 20); burst(c.x, c.y - 70, 14, ['#c8e07a', '#ffd23f'], 200, 4);
  }
}
function updateParts(dt) {
  for (const p of parts) {
    p.life -= dt; p.vy += p.grav * dt;
    if (p.drag) { const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.size += p.grow * dt;
  }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 45 * dt; }
  texts = texts.filter(t => t.life > 0);
}

// ---------- main update ----------
function update(dt) {
  if (pressed.mute) { audio.muted = !audio.muted; if (audio.muted) audio.stopBreath(); }
  if (state === 'title') {
    gtime += dt; cam.x = (gtime * 40) % 6000;
    titleBreath -= dt;
    if (titleBreath < -3.5) titleBreath = 1.8;
    if (titleBreath > 0) breathFire(cam.x + 280 + 8 * 2.4 * 1.15, 470 - 72 * 2.4, 1, dt, 0, 1.6);
    updateParts(dt);
    if (pressed.start || pressed.jump || pressed.shoot) newGame();
    return;
  }
  if (state === 'over' || state === 'win') { updateParts(dt); if (pressed.start) { state = 'title'; level = buildLevel(LEVEL_SEED); parts = []; } return; }
  if (pressed.pause && (state === 'play')) { paused = !paused; if (paused) audio.stopBreath(); else if (P.breath > 0) audio.startBreath(); }
  if (paused) return;
  if (hitStop > 0) { hitStop -= dt; return; }
  gtime += dt;
  solidList = level.solids.concat(crates);
  if (state === 'play') updatePlayer(dt);
  if (state === 'dead') { deadT -= dt; if (deadT <= 0) { if (lives > 0) respawn(); else { state = 'over'; saveBest(); } } }
  updateEnemies(dt); updateBoss(dt); updateProjectiles(dt); updatePickups(dt); updateParts(dt);
  if (winT > 0) { winT -= dt; if (winT <= 0) { state = 'win'; P.breath = 0; audio.stopBreath(); addScore(lives * 1000); saveBest(); } }

const SPR = {}; let sprLoaded = 0;
for (const k in SPR_DATA) { const im = new Image(); im.onload = () => sprLoaded++; im.src = SPR_DATA[k].src; SPR[k] = { img: im, x: SPR_DATA[k].x, y: SPR_DATA[k].y }; }
const SK = 0.23, FX = 131, FY = 456; // sprite scale, feet anchor in sprite pixels
function part(name, dx = 0, dy = 0) { const p = SPR[name]; ctx.drawImage(p.img, p.x + dx, p.y + dy); }
function drawSkullnaut(x, y, face, st, sc = 1) {
  if (sprLoaded < 5) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(face * sc * SK, sc * SK); ctx.translate(-FX, -FY);
  ctx.imageSmoothingQuality = 'high';
  let lL = 0, lR = 0, bob = 0, lean = 0, sy = 1;
  if (st.air) { lL = -0.38; lR = 0.28; bob = -4; }
  else if (Math.abs(st.vx) > 25) { const s = Math.sin(st.walk); lL = s * 0.38; lR = -s * 0.38; bob = -Math.abs(Math.cos(st.walk)) * 12; lean = 0.04; }
  else sy = 1 + Math.sin(st.t * 3) * 0.012;
  const breathing = st.breath > 0, punching = st.punch > 0;
  const pk = punching ? Math.sin((1 - st.punch / 0.24) * Math.PI) : 0;
  if (breathing) lean = -0.09;
  if (punching) lean = 0.07 * pk;
  // legs
  ctx.save(); ctx.translate(95, 322); ctx.rotate(lL); ctx.translate(-95, -322); part('legL'); ctx.restore();
  ctx.save(); ctx.translate(168, 322); ctx.rotate(lR); ctx.translate(-168, -322); part('legR'); ctx.restore();
  // upper body

  ctx.fillStyle = '#2b1a12'; ctx.beginPath(); rrPath(bx, by, bw, bh, 8); ctx.fill();
  if (P.ult > 0) {
    const g = ctx.createLinearGradient(bx, 0, bx + bw, 0); g.addColorStop(0, '#c2311a'); g.addColorStop(0.6, '#ff7a1a'); g.addColorStop(1, '#ffd23f');
    ctx.fillStyle = g; ctx.beginPath(); rrPath(bx + 2, by + 2, Math.max(8, (bw - 4) * P.ult / 100), bh - 4, 6); ctx.fill();
  }
  if (full) { ctx.save(); ctx.globalAlpha = 0.4 + 0.4 * Math.sin(gtime * 8); ctx.strokeStyle = '#fff6c8'; ctx.lineWidth = 3; ctx.beginPath(); rrPath(bx - 2, by - 2, bw + 4, bh + 4, 10); ctx.stroke(); ctx.restore(); }
  text(P.breath > 0 ? 'BURNING!' : full ? (isTouch ? 'FIRE BREATH READY!' : 'FIRE BREATH READY! [L]') : 'FIRE BREATH', bx + bw / 2, by + bh / 2 + 1, 11, '#fff6c8', 'center', COL.ol, 3);
  text('SCORE ' + String(score).padStart(6, '0'), W - 20, 30, 20, COL.skull, 'right');
  text('BEST ' + String(Math.max(best, score)).padStart(6, '0'), W - 20, 56, 12, '#e8b07a', 'right');
  // progress
  if (!arena) {
    const px = 360, pw = 240, prog = clamp(P.x / level.arenaX, 0, 1);
    ctx.fillStyle = 'rgba(43,26,18,0.6)'; ctx.fillRect(px, 24, pw, 6);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(px, 24, pw * prog, 6);
    miniSkull(px + pw * prog, 27, true, 0.8);
    text('BOSS', px + pw + 28, 27, 11, '#ff6b5b');
  }
  if (boss || (arena && winT > 0)) {
    const b = boss, bx2 = 230, bw2 = 500, y = H - 34;
    text('WARDEN-9', W / 2, y - 16, 14, '#ff6b5b');
    ctx.fillStyle = COL.ol; ctx.beginPath(); rrPath(bx2, y, bw2, 16, 6); ctx.fill();
    if (b) { ctx.fillStyle = b.hp < b.max * 0.5 ? '#ff3b2f' : '#e0a03a'; ctx.beginPath(); rrPath(bx2 + 2, y + 2, Math.max(4, (bw2 - 4) * b.hp / b.max), 12, 5); ctx.fill(); }
  }
  if (bannerT > 0 && Math.floor(bannerT * 4) % 2 === 0) { ctx.fillStyle = 'rgba(194,49,26,0.75)'; ctx.fillRect(0, H / 2 - 40, W, 80); text('!! WARNING: BOSS !!', W / 2, H / 2, 40, '#ffd23f'); }
}

// ---------- render ----------
function render() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  drawBackground();
  const sx = cam.shake ? rand(-cam.shake, cam.shake) * 0.6 : 0, sy = cam.shake ? rand(-cam.shake, cam.shake) * 0.6 : 0;
  ctx.save(); ctx.translate(-Math.round(cam.x) + sx, sy);
  drawWorld();
  if (state !== 'title') {
    for (const k of pickups) if (k.x > cam.x - 40 && k.x < cam.x + W + 40) drawPickup(k);
    for (const e of enemies) if (e.x > cam.x - 100 && e.x < cam.x + W + 100) drawEnemy(e);
    if (boss) drawBoss(boss);
    for (const w of waves) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,122,26,0.8)'; ctx.beginPath(); ctx.moveTo(w.x, w.y + w.h); ctx.quadraticCurveTo(w.x + w.w / 2, w.y - 20, w.x + w.w, w.y + w.h); ctx.fill(); ctx.restore(); }
    if (state === 'play' || state === 'win') { if (!(P.inv > 0 && Math.floor(P.inv * 14) % 2)) drawSkullnaut(P.x + P.w / 2, P.y + P.h, P.face, playerPose()); }
    if (state === 'play' && P.breath > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const mx = P.x + P.w / 2 + P.face * 8, my = P.y + P.h - 72; const g = ctx.createRadialGradient(mx, my, 0, mx, my, 60); g.addColorStop(0, 'rgba(255,200,100,0.35)'); g.addColorStop(1, 'rgba(255,120,30,0)'); ctx.fillStyle = g; ctx.fillRect(mx - 60, my - 60, 120, 120); ctx.restore(); }
    for (const b of bullets) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(255,210,63,0.5)'; ctx.beginPath(); ctx.ellipse(b.x - Math.sign(b.vx) * 8, b.y, 16, 5, 0, 0, PI2); ctx.fill(); ctx.restore(); circ(b.x, b.y, 4, '#fff6c8', true); }
    for (const b of ebullets) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; circ(b.x, b.y, b.r + 5, 'rgba(255,60,40,0.4)', true); ctx.restore(); circ(b.x, b.y, b.r - 1, b.big ? '#ffd23f' : '#ff6b5b', true); }
  } else {
    drawSkullnaut(cam.x + 280, 470, 1, { t: gtime, walk: 0, vx: 0, air: false, aim: 0, recoil: 0, punch: 0, breath: titleBreath > 0 ? 1 : 0 }, 2.4);
  }
  drawParts(false);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; drawParts(true); ctx.restore();
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life * 2); text(t.str, t.x, t.y, t.size, t.color); ctx.globalAlpha = 1; }
  ctx.restore();
  if (state === 'play' && P.breath > 0) { ctx.fillStyle = `rgba(255,110,30,${0.08 + 0.04 * Math.sin(gtime * 20)})`; ctx.fillRect(0, 0, W, H); }
  if (flashT > 0) { ctx.globalAlpha = Math.min(0.5, flashT * 2.5); ctx.fillStyle = flashCol; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

  if (state === 'title') drawTitle();
  else {
    drawHUD();
    if (paused) overlay('PAUSED', 'Press P to resume  ·  M to mute');
    if (state === 'dead' && lives > 0) text('OUCH! ' + lives + (lives === 1 ? ' LIFE' : ' LIVES') + ' LEFT', W / 2, H / 2, 32, COL.skull);
    if (state === 'over') overlay('GAME OVER', 'Score ' + score + '   ·   ' + (isTouch ? 'Tap' : 'Press ENTER') + ' to continue');
    if (state === 'win') overlay('PLANET IGNITED!', 'Warden-9 is toast!  Final score ' + score + '   ·   ' + (isTouch ? 'Tap' : 'ENTER') + ' to play again');
  }
}
function overlay(title, sub) {
  ctx.fillStyle = 'rgba(27,15,11,0.6)'; ctx.fillRect(0, 0, W, H);
  text(title, W / 2, H / 2 - 30, 56, COL.skull, 'center', COL.ol, 10);
  text(sub, W / 2, H / 2 + 30, 16, '#f0c890');
}
function drawTitle() {
  ctx.save(); ctx.translate(W / 2 + 120, 120); ctx.rotate(-0.03);
  text('SKULLNAUT', 6, 6, 84, COL.oliveD, 'center', COL.oliveD, 14);
  text('SKULLNAUT', 0, 0, 84, COL.skull, 'center', COL.ol, 12);
  text('IGNITE THE RED PLANET', 0, 58, 20, '#ffd23f');
  ctx.restore();
  ctx.fillStyle = 'rgba(43,26,18,0.7)'; ctx.beginPath(); rrPath(500, 200, 420, 170, 14); ctx.fill();
  const lines = isTouch
    ? [['◀ ▶', 'Move'], ['JUMP', 'Jump (tap twice = double jump)'], ['SHOOT', 'Blaster (hold)'], ['PUNCH', 'Smash & parry bullets'], ['FIRE', 'Fire Breath ultimate']]
    : [['A D / ← →', 'Move'], ['W / SPACE', 'Jump (press twice = double)'], ['J', 'Shoot blaster (hold)'], ['K', 'Punch — smash & parry'], ['L', 'FIRE BREATH ultimate'], ['S + JUMP', 'Drop through platform']];
  lines.forEach((l, i) => { text(l[0], 610, 222 + i * 25, 13, '#ffd23f', 'right', COL.ol, 3); text(l[1], 625, 222 + i * 25, 13, COL.skull, 'left', COL.ol, 3); });
  if (Math.floor(gtime * 2) % 2 === 0) text(isTouch ? 'TAP TO START' : 'PRESS ENTER TO START', 710, 410, 24, '#fff6c8');
  text('Kill enemies to charge the FIRE BREATH meter', 710, 445, 12, '#f0c890', 'center', COL.ol, 3);
  if (best) text('BEST ' + best, 710, 470, 12, '#e8b07a', 'center', COL.ol, 3);
}

// ---------- loop ----------
level = buildLevel(LEVEL_SEED);
P = makePlayer(80, GROUND - 80);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt);
  for (const k in pressed) pressed[k] = false;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = { get state() { return state; }, get P() { return P; }, get boss() { return boss; }, get enemies() { return enemies; }, get level() { return level; }, get score() { return score; }, press, release };
})();
</script>
</body>
</html>
